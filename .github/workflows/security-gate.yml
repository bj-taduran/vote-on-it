name: Security Gate

on:
  pull_request:
    branches:
      - main

# Minimum permissions: checkout + SARIF upload to the Security tab
permissions:
  contents: read
  security-events: write

jobs:

  # ── 1. SAST ────────────────────────────────────────────────────────────────
  sast-gosec:
    name: SAST — gosec
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: ${{ hashFiles('lambda/go.sum') != '' }}
          cache-dependency-path: lambda/go.sum

      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@v2.21.4

      # Pre-merge tuning strategy:
      #   -severity high -confidence high → only findings where gosec is highly
      #     confident the pattern IS a security issue AND rates it high severity.
      #     The intersection eliminates the majority of false positives.
      #   -conf ../.gosec.json → per-rule config (extended G101 pattern for HMAC).
      #   -exclude → rules that are notoriously noisy or structurally inapplicable
      #     to a Lambda function are excluded from the blocking gate:
      #       G104: unhandled errors — AWS SDK usage legitimately ignores many
      #             errors (e.g., log write failures); extremely high false-positive
      #             rate in idiomatic Go.
      #       G107: URL from variable to HTTP request — false positives when
      #             constructing AWS service endpoint strings at runtime.
      #       G304: file path as taint input — Lambda writes nothing to the
      #             filesystem; all storage goes through DynamoDB/Secrets Manager.
      #       G306: poor file permissions on write — same reason as G304.
      #       G108: pprof endpoint publicly accessible — Lambda has no HTTP server
      #             and never registers /debug/pprof routes.
      #       G115: integer overflow on type conversion — extremely noisy in
      #             Go 1.22+ where many valid int/uint conversions are flagged;
      #             the Go compiler already catches genuine overflows at compile time.
      # Guard: if Lambda source does not exist yet, emit an empty SARIF so the
      # upload step succeeds without blocking the PR.
      - name: Run gosec
        working-directory: lambda
        run: |
          if [ ! -f go.mod ]; then
            echo "No Go module found — Lambda source not yet written. Emitting empty SARIF."
            printf '{"version":"2.1.0","$schema":"https://json.schemastore.org/sarif-2.1.0.json","runs":[{"tool":{"driver":{"name":"gosec","version":"n/a","rules":[]}},"results":[]}]}' > gosec-results.sarif
            exit 0
          fi
          gosec \
            -conf ../.gosec.json \
            -severity high \
            -confidence high \
            -exclude G104,G107,G304,G306,G108,G115 \
            -fmt sarif \
            -out gosec-results.sarif \
            ./...

      # Always upload so reviewers can see findings even when the job failed.
      - name: Upload gosec SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: lambda/gosec-results.sarif
          category: gosec

  # ── 2. SCA ─────────────────────────────────────────────────────────────────
  sca-govulncheck:
    name: SCA — govulncheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: ${{ hashFiles('lambda/go.sum') != '' }}
          cache-dependency-path: lambda/go.sum

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.3

      # Capture JSON output regardless of exit code; severity is evaluated below.
      - name: Run govulncheck
        working-directory: lambda
        run: govulncheck -json ./... > govuln-output.json 2>&1 || true

      # govulncheck has no native severity filter, so we parse its OSV records:
      #   1. Prefer database_specific.severity (text label from Go advisory DB).
      #   2. Fall back to CVSS v3 base score computed from the vector string
      #      (requires the `cvss` package; score >= 7.0 = HIGH, >= 9.0 = CRITICAL).
      # Only HIGH / CRITICAL findings fail the build.
      - name: Check for HIGH / CRITICAL vulnerabilities
        run: |
          pip install cvss --quiet
          python3 << 'PYEOF'
          import json, sys
          try:
              from cvss import CVSS3
              HAS_CVSS = True
          except ImportError:
              HAS_CVSS = False

          FAIL_SEVERITIES = {"HIGH", "CRITICAL"}
          failures = []

          with open("lambda/govuln-output.json") as f:
              for line in f:
                  line = line.strip()
                  if not line:
                      continue
                  try:
                      msg = json.loads(line)
                  except ValueError:
                      continue
                  osv = msg.get("osv")
                  if not osv:
                      continue
                  vuln_id = osv.get("id", "unknown")
                  summary = osv.get("summary", "no summary")
                  sev = None

                  db_sev = osv.get("database_specific", {}).get("severity", "").upper()
                  if db_sev in FAIL_SEVERITIES:
                      sev = db_sev

                  if not sev and HAS_CVSS:
                      for s in osv.get("severity", []):
                          if s.get("type", "").startswith("CVSS_V3"):
                              try:
                                  score = float(CVSS3(s["score"]).base_score)
                                  if score >= 9.0:
                                      sev = "CRITICAL"
                                  elif score >= 7.0:
                                      sev = "HIGH"
                              except Exception:
                                  pass

                  if sev:
                      failures.append(f"{vuln_id} [{sev}]: {summary}")
                      print(f"::error::{vuln_id} [{sev}]: {summary}")

          if failures:
              print(f"\nFailed: {len(failures)} HIGH/CRITICAL vulnerability(ies) detected.")
              sys.exit(1)
          print("govulncheck: no HIGH/CRITICAL vulnerabilities found.")
          PYEOF

  # ── 3. IaC ─────────────────────────────────────────────────────────────────
  iac-checkov:
    name: IaC — checkov
    runs-on: ubuntu-latest
    env:
      TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform.d/plugin-cache
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.10.5'

      - name: Cache Terraform plugins
        uses: actions/cache@v4
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: ${{ runner.os }}-terraform-${{ hashFiles('**/.terraform.lock.hcl') }}
          restore-keys: ${{ runner.os }}-terraform-

      - name: Create Terraform plugin cache dir
        run: mkdir -p "$TF_PLUGIN_CACHE_DIR"

      - name: Terraform format check
        working-directory: terraform
        run: terraform fmt -check -recursive

      - name: Terraform validate
        working-directory: terraform
        run: |
          terraform init -backend=false
          terraform validate

      - name: Install checkov
        run: pip install checkov==3.2.351

      # Pre-merge tuning strategy:
      #   --config-file .checkov.yaml → runs ONLY the checks listed in the allowlist
      #     (14 rules covering public exposure, encryption, key rotation, audit
      #     durability, perimeter security, and hardcoded secrets). Every other
      #     Checkov rule is silently skipped; best-practice and medium-severity
      #     checks are deferred to the async Acceptance stage.
      #   --soft-fail-on LOW,MEDIUM,INFO → belt-and-suspenders in case a lower-
      #     severity check is ever added to the YAML; has no effect while the
      #     allowlist contains only HIGH/CRITICAL controls.
      #   Output formats (cli + sarif) and scan directory are declared in .checkov.yaml.
      - name: Run checkov
        run: |
          checkov \
            --config-file .checkov.yaml \
            --output-file-path checkov-results \
            --soft-fail-on LOW,MEDIUM,INFO

      - name: Upload checkov SARIF
        if: always() && hashFiles('checkov-results/results_sarif.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: checkov-results/results_sarif.sarif
          category: checkov

  # ── 4. Secrets ─────────────────────────────────────────────────────────────
  secrets-trufflehog:
    name: Secrets — TruffleHog
    runs-on: ubuntu-latest
    steps:
      # Full history is required so TruffleHog can walk the commit range of the PR.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Scans only the commits introduced by this PR (base→head).
      # --only-verified suppresses unverifiable detector matches to reduce noise.
      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@v3.88.1
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
          extra_args: --only-verified
